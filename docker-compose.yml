name: namma-kasa

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nammakasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-nammakasa}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nammakasa}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Driver GPS ingest broker. 1883 = MQTT, 18083 = dashboard.
  emqx:
    image: emqx/emqx:5.8
    environment:
      # Devices authenticate with a per-trip JWT whose `acl` claim grants
      # publish to exactly one trip topic (contracts/realtime.md §1). The
      # secret matches the API's JWT_SECRET so no key distribution is needed.
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__2__MECHANISM: jwt
      EMQX_AUTHENTICATION__2__FROM: password
      EMQX_AUTHENTICATION__2__USE_JWKS: "false"
      EMQX_AUTHENTICATION__2__ALGORITHM: "hmac-based"
      EMQX_AUTHENTICATION__2__SECRET: ${JWT_SECRET:-dev-only-change-me}
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: built_in_database
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-devpassword}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 20

  # S3-compatible media store (driver photos, complaint photos).
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  redis-data:
  emqx-data:
  minio-data:
